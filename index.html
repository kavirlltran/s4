<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Speech Comparison App</title>
  <style>
    /* Reset cơ bản */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    /* 
      Tạo nền phong cách tương lai:
      - linear-gradient tạo hiệu ứng chuyển màu sâu, hiện đại.
      - radial-gradient lặp lại tạo hiệu ứng "sao" nhẹ.
    */
    body {
      font-family: 'Roboto', sans-serif;
      background: 
        radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px),
        linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      background-size: 50px 50px, cover;
      background-attachment: fixed;
      color: #ffffff;
      padding: 20px;
      min-height: 100vh;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
    .instruction {
      margin-bottom: 20px;
      font-style: italic;
      text-align: center;
    }
    .text-lines {
      margin-bottom: 20px;
    }
    .text-line {
      padding: 10px;
      margin-bottom: 5px;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    .text-line:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.02);
    }
    /* Các dòng được chọn sẽ nổi bật với nền đậm, viền dày, đổ bóng và hiệu ứng phóng to */
    .selected {
      background: rgba(0, 150, 136, 0.8);
      border: 2px solid #00ffcc;
      box-shadow: 0 0 10px 2px #00ffcc;
      transform: scale(1.05);
    }
    .controls {
      text-align: center;
      margin-bottom: 20px;
    }
    button {
      background: #009688;
      color: #fff;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }
    button:hover {
      background: #00796b;
    }
    .result {
      font-size: 18px;
      line-height: 1.6;
      margin-top: 20px;
      text-align: center;
    }

    .minor {
      background-color: yellow;
      color: black;
